name: Catalog contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out catalog authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read immutable core lock
        id: core_lock
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("core-tool.lock.json") as stream:
              lock = json.load(stream)
          print("repository=" + lock["repository"])
          print("commit=" + lock["commit"])
          PY
      - name: Check out pinned Tournament core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.core_lock.outputs.repository }}
          ref: ${{ steps.core_lock.outputs.commit }}
          path: .core/rps-tournament
      - name: Verify immutable companion-to-core contract
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: python3 -m unittest tests/test_core_contract.py -v
