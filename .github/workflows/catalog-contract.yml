name: Catalog contract

on:
  push:
    branches: [main]
    tags: ["catalog-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out catalog authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize bundled pinned Tournament core
        run: ./materialize-core-tool .core/rps-tournament
      - name: Verify immutable companion-to-core contract
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: python3 -m unittest tests/test_core_contract.py -v
      - name: Verify immutable Language Environment Catalog release record
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: |
          git fetch --no-tags --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./freeze-tournament-catalog verify "${GITHUB_REF_NAME}"
