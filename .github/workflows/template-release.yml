name: Template Release

on:
  push:
    branches: [main]
    tags: ["template-v*", "*-template-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the Team Template repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize the pinned Runner Catalog Release
        run: ./materialize-core-tool .core/rps-tournament
      - name: Verify the Template Release contract
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: |
          release_tag="$(python3 -c 'import json; print(json.load(open("templates/python/team-template.json"))["release_tag"])')"
          ./release-team-template --template python manifest "${release_tag}"
          toolchain="$(python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("core-tool.lock.json").read_text())
          catalog_path = Path(".core/rps-tournament") / lock["catalog"]["path"]
          catalog = json.loads(catalog_path.read_text())
          asset = catalog["environments"]["python"]["assets"]["build_toolchain"]["path"]
          runtimes = json.loads((catalog_path.parent / asset).read_text())
          print(runtimes["platforms"]["linux/amd64"]["build_toolchain"]["image"])
          PY
          )"
          docker pull --platform linux/amd64 "$toolchain"
          RPS_CORE_PATH=.core/rps-tournament \
            ./check-team-template --template python --mode docker
          python3 -m unittest discover -s tests -v
      - name: Verify the published annotated Template Release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RPS_CORE_PATH: .core/rps-tournament
        run: |
          git fetch --no-tags --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            python-template-v*)
              ./release-team-template --template python verify "${GITHUB_REF_NAME}"
              ;;
            *)
              ./release-team-template verify "${GITHUB_REF_NAME}"
              ;;
          esac
